# KT-Radar site config :: Shahrah-e-Faisal @ Nursery flyover approach
# ---------------------------------------------------------------------------
# HOW TO CALIBRATE (do this once per camera, it takes 20 minutes):
#   1. Grab one frame from the stream.
#   2. Pick 4 points on the ROAD SURFACE forming a rectangle in reality
#      (lane markings + two joints, or two poles a known distance apart).
#      Order: top-left, top-right, bottom-right, bottom-left.
#   3. Measure that rectangle on the ground (or from satellite imagery in
#      QGIS / Google Earth ruler). Width across the carriageway, length along it.
#   4. Sanity check: run a clip, watch a bus. If it reads 300 km/h your points
#      are off the ground plane. Speed error is almost always calibration error.

site_id: khi_sef_nursery_nb
name: "Shahrah-e-Faisal / Nursery (northbound approach)"
# Do not commit real camera credentials. Substitute at deploy time, e.g.
# rtsp_url: "rtsp://${KTR_CAM_USER}:${KTR_CAM_PASS}@10.20.3.14:554/..."
rtsp_url: "rtsp://user:pass@10.20.3.14:554/Streaming/Channels/101"

fps_target: 15
imgsz: 960
conf: 0.30
iou: 0.55
device: "cuda:0"
weights: "models/ktr_vehicles_yolo11s.pt"

# ---- ground plane -----------------------------------------------------
source_polygon:
  - [612, 388]      # TL
  - [1298, 392]     # TR
  - [1846, 1004]    # BR
  - [122, 998]      # BL
target_size_m: [14.6, 52.0]     # 4 lanes ≈ 3.65 m each, 52 m of road

# ---- counting ---------------------------------------------------------
count_lines:
  cordon_north: [[140, 820], [1790, 828]]
  ramp_entry:   [[1320, 560], [1860, 700]]

lanes:
  lane_bike:  [[122, 998], [430, 998], [700, 392], [612, 388]]
  lane_1:     [[430, 998], [900, 998], [860, 390], [700, 392]]
  lane_2:     [[900, 998], [1380, 998], [1030, 390], [860, 390]]
  lane_bus:   [[1380, 998], [1846, 1004], [1298, 392], [1030, 390]]

stop_line: [[150, 742], [1800, 750]]

legal_heading: [0.0, -1.0]      # traffic moves toward decreasing y in metric space

speed_limit_kmh: 60
min_track_len: 8

congestion_density_thr: 0.09
congestion_speed_thr: 12.0

# ---- violation rule engine (src/violations.py) -------------------------
restricted_lanes:
  lane_bus: ["bus", "minibus"]
no_uturn_zone: null
calib_quality: 1.0
violation_min_conf: 0.80
rider_model_weights: null  # e.g. "models/ktr_helmet_occupancy.pt"

# ---- ANPR + privacy (src/anpr.py, src/privacy.py) ----------------------
plate_weights: null  # e.g. "models/ktr_plate_yolo11n.pt" - unset disables ANPR
face_blur_weights: "models/face_yolov8n.pt"  # unset disables face blur (not recommended)
