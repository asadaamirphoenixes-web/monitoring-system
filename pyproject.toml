[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# UP (pyupgrade) deliberately excluded: the codebase consistently uses
# typing.Optional/Dict/List (pre-3.10 style) rather than X | None / dict[..],
# and enforcing the rewrite would be a large, purely cosmetic diff across
# every module for no functional gain.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
